[project]
name = "plc-lab"
version = "0.1.0"
description = "A PLC / OT security home-lab roadmap and a source-checked Anki deck"
requires-python = ">=3.14"
license = "MIT"
# genanki writes the .apkg; the excerpt check needs only the standard library
# plus poppler's pdftotext for PDF sources. The tutor (plc_lab/tutor) adds:
# claude-agent-sdk (drives the logged-in claude CLI, no API key), starlette +
# uvicorn (the localhost page), schemdraw (code-drawn circuit diagrams) and
# earned-time (the signed ledger the tutor's credit rows go in).
dependencies = [
    "genanki==0.13.1",
    "claude-agent-sdk==0.2.165",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "schemdraw==0.23",
    "earned-time @ git+https://github.com/kuhyx/utils@earned-time-v0.6.1#subdirectory=earned_time",
]

[project.optional-dependencies]
# httpx: Starlette's TestClient (the tutor's HTTP tests) needs it.
dev = ["mypy==2.4.0", "pylint==4.1.2", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.0", "gdtoolkit==4.5.0", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plc_lab*"]

[tool.setuptools.package-data]
"plc_lab.tutor" = ["static/*"]

[tool.ruff]
target-version = "py314"
include = ["*.py", "**/*.py"]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D213", "COM812", "ISC001", "S603",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "ANN", "ARG", "D", "E501", "FBT", "PLC0415", "PLR0913", "PLR2004", "PTH",
    "S101", "SLF001",
]
# A command line's job is to write to stdout.
"plc_lab/cli.py" = ["T201"]
# Run by hand; its progress lines are the evidence the import worked.
"scripts/import_to_server.py" = ["T201"]
# Run by hand; their stdout lines are the evidence (canary, run, verdicts).
"plc_lab/tutor/__main__.py" = ["T201"]
"plc_lab/tutor/isolation.py" = ["T201"]
# Run by hand; its progress lines are the evidence the session ran.
"plc_lab/tutor/scripted.py" = ["T201"]
"plc_lab/tutor/adjudicate.py" = ["T201"]
# Sources are https URLs from the card files (cards.py rejects anything else).
"plc_lab/sources.py" = ["S310"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["plc_lab"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true
exclude = [".venv/"]

[tool.pylint.main]
py-version = "3.14"
jobs = 0
ignore = [".venv", "__pycache__"]
ignore-paths = ["^(.*/)?tests/.*$"]

[tool.pylint.messages_control]
enable = "all"
disable = [
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
]

[tool.pylint.design]
min-public-methods = 0
# The tutor's turn / replay records carry 9-12 fields; same cap as testsAndMisc.
max-attributes = 12

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["plc_lab/tests", "plc_lab/tutor/tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=plc_lab",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
omit = ["plc_lab/tests/*", "plc_lab/tutor/tests/*"]
