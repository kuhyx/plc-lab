# plc-lab's commit gate: the same Python hooks as the sibling guard repos
default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false
# sim/addons is GUT (cloned by scripts/sim_setup.sh); sim/.godot is Godot's cache.
exclude: ^(build|sim/addons|sim/\.godot)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^plc_lab/(tutor/)?tests/(_[a-z][a-z_]*|conftest)\.py$
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      # The dev venv (scripts/setup_dev.sh) has every runtime dependency, so
      # mypy runs strict with no disabled error codes.
      - id: mypy
        name: mypy (strict, dev venv)
        entry: .venv/bin/python -m mypy plc_lab
        language: system
        pass_filenames: false
        types: [python]
      - id: pylint
        name: pylint (dev venv)
        entry: .venv/bin/python -m pylint --rcfile=pyproject.toml --fail-under=10 plc_lab
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest (100% branch coverage)
        entry: .venv/bin/python -m pytest -p no:cacheprovider -q
        language: system
        pass_filenames: false
        types: [python]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, --severity-level=high, --confidence-level=medium]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(plc_lab/tests/|scripts/)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --skip=*.json,*.lock,.git,__pycache__,.venv
          - --ignore-words-list=nd,te,als,ans,ot
          - --uri-ignore-words-list=produkt
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: bash -c 'printf "%s\0" "$@" | xargs -0 -n 40 shellcheck --severity=warning' --
        language: system
        types: [shell]
      - id: file-length
        name: file length <= 250 lines
        entry: scripts/check_file_length.sh
        language: system
      - id: no-silent-failures
        name: Block silent failures (swallowed exceptions must log why)
        entry: python3 scripts/check_silent_failures.py
        language: system
        types: [python]
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pyproject\.toml|requirements.*\.txt
          |\.github/workflows/.*\.ya?ml)$
      # The Godot sorting line: gdlint, gdformat --check and a headless parse
      # with warnings as errors. Needs godot + scripts/sim_setup.sh; the
      # Python CI job skips it and .github/workflows/sim.yml runs it instead.
      - id: sim-lint
        name: sim lint (gdlint, gdformat, strict parse)
        entry: scripts/sim_lint.sh
        language: system
        pass_filenames: false
        files: ^sim/.*\.gd$
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$
