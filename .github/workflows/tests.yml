name: tests

# The Python suite (100% branch coverage is enforced by pyproject's addopts)
# and the full pre-commit gate, from the same dev venv setup_dev.sh builds.
# Two parallel jobs over a cached venv and hook store: in series and built
# from scratch they took 90 s, past the one-minute budget.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [pytest, pre-commit]
    name: python (${{ matrix.task }})
    steps:
      - uses: actions/checkout@v4
      - name: Check out the shared gates
        uses: actions/checkout@v4
        with:
          repository: kuhyx/utils
          path: .utils
      - name: Point the delegates at that checkout
        run: echo "UTILS_ROOT=$GITHUB_WORKSPACE/.utils" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.x"
      - name: Ensure shellcheck
        run: command -v shellcheck || sudo apt-get install -y shellcheck
      # The editable install points at this checkout's path, which is the same
      # on every run, so the restored venv is valid as-is.
      - name: Restore the dev venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ steps.py.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Dev venv
        run: bash scripts/setup_dev.sh
      - if: matrix.task == 'pytest'
        name: Tests
        run: .venv/bin/python -m pytest -p no:cacheprovider -q
      - if: matrix.task == 'pre-commit'
        name: Restore the pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ steps.py.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - if: matrix.task == 'pre-commit'
        name: pre-commit (Python hooks)
        run: |
          .venv/bin/python -m pip install --quiet pre-commit
          SKIP=dependency-freshness .venv/bin/pre-commit run --all-files
